name: CI

# Score-10 P2: un solo gate SQL. No hay job informativo en paralelo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-smoke-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: polaria

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Humo SQL bloqueante (auth y migraciones 121 y 122)
        run: bash scripts/sql-smoke.sh
